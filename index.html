<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Tenaga BLUD RSUD dr. Soedarso 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0B5ED7, #0A3D91);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            color: #1d2939;
            width: 100%;
            max-width: 600px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .logo {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 22px;
            color: #0B5ED7;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: #667085;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* Tombol Unduh/Buat File */
        .btn-outline {
            background: #F0F5FF;
            color: #0B5ED7;
            border: 2px solid #D0E1FD;
        }

        .btn-outline:hover {
            background: #E1ECFE;
            border-color: #0B5ED7;
            transform: translateY(-2px);
        }

        /* Tombol utama Daftar */
        .btn-primary {
            background: #0B5ED7;
            color: white;
            box-shadow: 0 4px 14px rgba(11, 94, 215, 0.4);
            margin-top: 6px;
        }

        .btn-primary:hover {
            background: #084298;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(11, 94, 215, 0.5);
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #8896AB;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 20px;
            }
            .btn {
                font-size: 13px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🏥</div>
        <h1>Pendaftaran Tenaga BLUD<br>RSUD dr. Soedarso 2026</h1>
        <p class="subtitle">Silakan siapkan dokumen persyaratan sebelum mendaftar.</p>

        <div class="button-group">
            <!-- Ganti href="#" dengan link Anda nanti -->
            <a href="#" class="btn btn-outline" target="_blank">
                📄 1. Buat File Surat Tidak Sedang Menjalani Kontrak
            </a>
            
            <!-- Ganti href="#" dengan link Anda nanti -->
            <a href="#" class="btn btn-outline" target="_blank">
                📄 2. Buat File Kesediaan Menjadi Pegawai BLUD
            </a>

            <!-- Tombol Utama Pendaftaran -->
            <a href="https://script.google.com/macros/s/AKfycby-dYEniWdUvMRpp4PhFmE6hioFwZdLTRneTk5A6SOO9Gm-l2wSfooxuKg2o1zCiwceag/exec" class="btn btn-primary" target="_blank">
                📝 3. DAFTAR SEKARANG
            </a>
        </div>

        <footer>
            © 2026 RSUD dr. Soedarso
        </footer>
    </div>

</body>
</html>
